<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交互式英文阅读 (DeepSeek版)</title>
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <!-- 引入自定义样式 -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="flex justify-center py-12">

    <!-- Top Right Buttons -->
    <div class="fixed top-4 right-4 flex space-x-2 z-50">
        <!-- Print Button -->
        <button id="print-btn" class="bg-white p-2 rounded-full shadow-lg hover:bg-gray-100 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
            </svg>
        </button>
        <!-- Library Button -->
        <button id="library-btn" class="bg-white p-2 rounded-full shadow-lg hover:bg-gray-100 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
        </button>
        <!-- TOC Button -->
        <button id="toc-btn" class="bg-white p-2 rounded-full shadow-lg hover:bg-gray-100 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h10M4 18h6" />
            </svg>
        </button>
        <!-- Search Button -->
        <button id="search-btn" class="bg-white p-2 rounded-full shadow-lg hover:bg-gray-100 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M5 11a6 6 0 1112 0 6 6 0 01-12 0z" />
            </svg>
        </button>
        <!-- User Profile Button -->
        <button id="user-btn" class="bg-white p-2 rounded-full shadow-lg hover:bg-gray-100 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
        </button>
    </div>
    
    <!-- Library Modal -->
    <div id="library-modal" class="fixed inset-0 bg-gray-900 bg-opacity-60 items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-2xl relative mx-auto mt-16">
             <button id="close-library-modal-btn" class="absolute top-3 right-3 text-gray-500 hover:text-gray-800 transition-transform duration-200 hover:rotate-90">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <h3 class="text-xl font-bold mb-4 text-gray-800">书库</h3>
            <div id="library-list" class="space-y-3"></div>
        </div>
    </div>

    <!-- TOC Modal -->
    <div id="toc-modal" class="fixed inset-0 bg-gray-900 bg-opacity-60 items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md relative mx-auto mt-16">
            <button id="close-toc-modal-btn" class="absolute top-3 right-3 text-gray-500 hover:text-gray-800 transition-transform duration-200 hover:rotate-90">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <h3 class="text-xl font-bold mb-4 text-gray-800">章节目录</h3>
            <div id="toc-list" class="space-y-2 max-h-[420px] overflow-y-auto"></div>
        </div>
    </div>

    <!-- Search Modal -->
    <div id="search-modal" class="fixed inset-0 bg-gray-900 bg-opacity-60 items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-2xl relative mx-auto mt-16">
            <button id="close-search-modal-btn" class="absolute top-3 right-3 text-gray-500 hover:text-gray-800 transition-transform duration-200 hover:rotate-90">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <h3 class="text-xl font-bold mb-4 text-gray-800">全文检索</h3>
            <form id="search-form" class="flex space-x-2 mb-4">
                <input id="search-input" type="text" class="flex-1 border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="输入关键字，至少2个字符" required minlength="2">
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md text-sm hover:bg-blue-700 transition-colors whitespace-nowrap">检索</button>
            </form>
            <div id="search-status" class="text-sm text-gray-500 h-5"></div>
            <div id="search-results" class="mt-4 space-y-3 max-h-[360px] overflow-y-auto"></div>
        </div>
    </div>

    <!-- User Modal -->
    <div id="user-modal" class="fixed inset-0 bg-gray-900 bg-opacity-60 items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md relative mx-auto mt-16">
            <button id="close-user-modal-btn" class="absolute top-3 right-3 text-gray-500 hover:text-gray-800 transition-transform duration-200 hover:rotate-90">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <div id="profile-view">
                <h3 class="text-xl font-bold mb-1 text-gray-800">个人资料</h3>
                <div class="mb-3">
                    <p class="text-sm text-gray-500">用户名</p>
                    <div class="flex items-center justify-between">
                        <span id="user-username-display" class="text-base font-semibold text-gray-800">-</span>
                        <button id="user-username-edit-btn" class="text-sm text-blue-600 hover:text-blue-500">修改</button>
                    </div>
                    <div id="user-username-edit" class="mt-2 hidden space-y-2">
                        <input type="text" id="user-username-input" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" placeholder="请输入新的用户名">
                        <div class="flex items-center space-x-2">
                            <button id="user-username-save-btn" class="bg-blue-600 text-white px-3 py-1 rounded-md text-sm hover:bg-blue-700">保存</button>
                            <button id="user-username-cancel-btn" class="text-sm text-gray-600 hover:text-gray-800">取消</button>
                            <span id="user-username-status" class="text-xs text-gray-500"></span>
                        </div>
                    </div>
                </div>
                <div class="mb-4">
                    <p class="text-sm text-gray-500">邮箱</p>
                    <p class="text-base font-semibold text-gray-800" id="user-email-display">-</p>
                </div>
                <label class="block text-sm font-medium text-gray-700 mb-1">DeepSeek API Key</label>
                <div class="flex items-center space-x-2">
                    <input type="password" id="api-key-input" class="border border-gray-300 rounded-md px-3 py-2 text-sm w-full focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="在此输入或清空您的 API Key">
                    <button id="save-key-btn" class="bg-blue-600 text-white px-4 py-2 rounded-md text-sm hover:bg-blue-700 transition-colors whitespace-nowrap">保存</button>
                </div>
                <p id="save-status" class="text-green-600 text-xs mt-2 h-4"></p>
                <button id="clear-progress-btn" class="w-full mt-4 bg-yellow-500 text-white py-2 rounded-md text-sm hover:bg-yellow-600 transition-colors">清除本书翻译</button>
                <button id="logout-btn" class="w-full mt-2 bg-red-500 text-white py-2 rounded-md text-sm hover:bg-red-600 transition-colors">退出登录 (清除所有数据)</button>
            </div>
        </div>
    </div>
    
    <!-- Print Modal -->
    <div id="print-modal" class="fixed inset-0 bg-gray-900 bg-opacity-60 items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md relative mx-auto mt-16">
            <button id="close-print-modal-btn" class="absolute top-3 right-3 text-gray-500 hover:text-gray-800 transition-transform duration-200 hover:rotate-90">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <h3 class="text-xl font-bold mb-4 text-gray-800">打印设置</h3>
            <label for="print-range-input" class="block text-sm font-medium text-gray-700 mb-2">请输入页码或范围 (留空则打印全部)</label>
            <input type="text" id="print-range-input" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm mb-4 focus:ring-2 focus:ring-blue-500" placeholder="例如: 1-3, 5, 7">
            <button id="confirm-print-btn" class="w-full bg-blue-600 text-white py-2 rounded-md text-sm hover:bg-blue-700 transition-colors">确认打印</button>
            <p id="print-error" class="text-red-500 text-xs mt-2 h-4"></p>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 bg-gray-900 bg-opacity-60 items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md relative mx-auto mt-16">
            <!-- 登录框的关闭按钮已被移除，强制用户登录 -->
            <!-- <button id="close-login-modal-btn" class="absolute top-3 right-3 text-gray-500 hover:text-gray-800 transition-transform duration-200 hover:rotate-90">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button> -->
            <h3 class="text-xl font-bold mb-4 text-gray-800">用户登录</h3>
            <form id="login-form">
                <div class="mb-4">
                    <label for="login-email" class="block text-sm font-medium text-gray-700 mb-1">邮箱地址</label>
                    <input type="email" id="login-email" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" placeholder="请输入邮箱" required>
                </div>
                <div class="mb-4">
                    <label for="login-password" class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                    <input type="password" id="login-password" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md text-sm hover:bg-blue-700 transition-colors">登录</button>
                <p class="text-center text-sm text-gray-600 mt-4">
                    还没有账号？ 
                    <button type="button" id="show-register-btn" class="text-blue-600 hover:underline">立即注册</button>
                </p>
            </form>
            <p id="login-error" class="text-red-500 text-xs mt-2 h-4 text-center"></p>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="register-modal" class="fixed inset-0 bg-gray-900 bg-opacity-60 items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md relative mx-auto mt-16">
            <!-- 注册框的关闭按钮也移除 -->
            <!-- <button id="close-register-modal-btn" class="absolute top-3 right-3 text-gray-500 hover:text-gray-800 transition-transform duration-200 hover:rotate-90">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button> -->
            <h3 class="text-xl font-bold mb-4 text-gray-800">用户注册</h3>
            <form id="register-form">
                <div class="mb-4">
                    <label for="register-email" class="block text-sm font-medium text-gray-700 mb-1">邮箱地址</label>
                    <input type="email" id="register-email" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" placeholder="请输入邮箱" required>
                </div>
                <div class="mb-4">
                    <label for="register-username" class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                    <input type="text" id="register-username" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" placeholder="请输入用户名" required>
                </div>
                <div class="mb-4">
                    <label for="register-password" class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                    <input type="password" id="register-password" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" placeholder="请输入密码（至少6位）" minlength="6" required>
                </div>
                <div class="mb-4">
                    <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1">确认密码</label>
                    <input type="password" id="confirm-password" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" placeholder="请再次输入密码" minlength="6" required>
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-md text-sm hover:bg-green-700 transition-colors">注册</button>
                <p class="text-center text-sm text-gray-600 mt-4">
                    已有账号？ 
                    <button type="button" id="show-login-btn" class="text-blue-600 hover:underline">立即登录</button>
                </p>
            </form>
            <p id="register-error" class="text-red-500 text-xs mt-2 h-4 text-center"></p>
        </div>
    </div>

    <!-- A4页面容器 (修改点：添加 hidden 类，默认隐藏) -->
    <div id="main-container" class="flex flex-col items-center hidden">
        <div id="page-container" class="page bg-white shadow-lg p-16 text-xs leading-snug">
            <div id="content"></div>
        </div>
        <div id="pagination-controls" class="mt-4 flex items-center space-x-4"></div>
    </div>
    
    <!-- AI Modal -->
    <div id="ai-modal" class="fixed inset-0 bg-gray-900 bg-opacity-60 items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-2xl relative mx-auto mt-16">
            <button id="close-modal-btn" class="absolute top-3 right-3 text-gray-500 hover:text-gray-800 transition-transform duration-200 hover:rotate-90">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <h3 class="text-xl font-bold mb-4 text-gray-800" id="modal-title">✨ AI 助解</h3>
            <div id="modal-content" class="text-base leading-relaxed text-gray-700">
                <div id="modal-loader" class="flex justify-center items-center h-32">
                     <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
                </div>
                <p id="ai-response" class="whitespace-pre-wrap font-sans"></p>
            </div>
        </div>
    </div>
    
    <!-- Print Container -->
    <div id="print-container" class="hidden"></div>

    <!-- 
      修改点：
      1. 将 main.js 标记为 type="module"
      2. 移除了其他被注释掉的脚本，因为它们现在由 main.js 导入
    -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
