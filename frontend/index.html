<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交互式英文阅读 (DeepSeek版)</title>
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <!-- 引入自定义样式 -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-gray-50 text-gray-800 font-sans h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-white border-r border-gray-200 flex flex-col transition-all duration-300 z-20">
        <div class="p-6 border-b border-gray-100 flex items-center space-x-3">
            <!-- Placeholder Logo -->
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">E
            </div>
            <h1 class="text-xl font-bold text-gray-800 tracking-tight">englearn</h1>
        </div>

        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <button id="nav-library"
                class="w-full flex items-center space-x-3 px-3 py-2 rounded-md text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors group active-nav-item">
                <svg class="w-5 h-5 text-gray-400 group-hover:text-blue-500" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
                <span class="font-medium">书库</span>
            </button>
            <button id="nav-toc"
                class="w-full flex items-center space-x-3 px-3 py-2 rounded-md text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors group hidden">
                <svg class="w-5 h-5 text-gray-400 group-hover:text-blue-500" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h10M4 18h6" />
                </svg>
                <span class="font-medium">目录</span>
            </button>
            <button id="nav-search"
                class="w-full flex items-center space-x-3 px-3 py-2 rounded-md text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors group hidden">
                <svg class="w-5 h-5 text-gray-400 group-hover:text-blue-500" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-4.35-4.35M5 11a6 6 0 1112 0 6 6 0 01-12 0z" />
                </svg>
                <span class="font-medium">搜索</span>
            </button>
        </nav>

        <div class="p-4 border-t border-gray-100">
            <button id="user-btn"
                class="w-full flex items-center space-x-3 px-3 py-2 rounded-md text-gray-700 hover:bg-gray-100 transition-colors">
                <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-gray-500">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
                <div class="flex-1 text-left">
                    <p id="sidebar-username" class="text-sm font-medium text-gray-900 truncate">未登录</p>
                    <p class="text-xs text-gray-500">点击查看资料</p>
                </div>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative">

        <!-- Top Bar (Mobile/Tablet toggle & Reading Settings) -->
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 z-10">
            <div class="flex items-center">
                <button id="sidebar-toggle" class="p-2 rounded-md text-gray-500 hover:bg-gray-100 mr-4 lg:hidden" aria-label="展开或收起侧边栏">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                <h2 id="page-title" class="text-lg font-semibold text-gray-800">书库</h2>
            </div>
            <div class="flex items-center space-x-4">
                <!-- Reading Settings (Visible only in Reader View) -->
                <div id="reading-settings" class="hidden flex items-center space-x-2">
                    <button id="font-decrease" class="p-2 text-gray-500 hover:text-gray-800" title="减小字号">A-</button>
                    <button id="font-increase" class="p-2 text-gray-500 hover:text-gray-800" title="增大字号">A+</button>
                    <button id="print-btn" class="p-2 text-gray-500 hover:text-gray-800" title="打印当前页">打印</button>
                    <input id="print-range-input" type="text" inputmode="numeric" pattern="[0-9,\\-\\s]*"
                        class="w-28 border border-gray-300 rounded-md px-2 py-1 text-sm text-gray-700 focus:outline-none focus:ring-1 focus:ring-blue-500"
                        placeholder="页码如 1-3,5" title="输入要打印的页码范围，如 1-3,5">
                    <button id="print-range-btn" class="p-2 text-gray-500 hover:text-gray-800" title="打印指定页码">打印范围</button>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <div id="content-area" class="flex-1 overflow-y-auto bg-gray-50 p-6 relative">

            <!-- View: Library (Dashboard) -->
            <div id="view-library" class="max-w-7xl mx-auto">
                <div id="library-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <!-- Book Cards will be injected here -->
                </div>
            </div>

            <!-- View: Reader -->
            <div id="view-reader" class="hidden h-full flex flex-col items-center">
                <div id="reader-scroll-container" class="w-full max-w-5xl flex-1 overflow-y-auto px-4 pb-20">
                    <!-- 核心阅读容器：保持原有结构以支持翻译交互 -->
                    <div id="page-container"
                        class="bg-white shadow-sm rounded-lg p-8 md:p-12 min-h-full text-lg leading-loose">
                        <div id="content"></div>
                    </div>
                </div>

                <!-- Floating Pagination Controls -->
                <div id="pagination-controls"
                    class="absolute bottom-6 left-1/2 transform -translate-x-1/2 bg-white border border-gray-200 shadow-lg rounded-full px-6 py-2 flex items-center space-x-4 z-20">
                    <!-- Pagination injected by JS -->
                </div>
            </div>

        </div>
    </main>

    <!-- Modals (Refactored) -->

    <!-- TOC Modal (Now a Sidebar Panel or Modal, keeping Modal for simplicity first) -->
    <div id="toc-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm items-center justify-center hidden z-50 p-4">
        <div
            class="bg-white rounded-xl shadow-2xl w-full max-w-md max-h-[80vh] flex flex-col overflow-hidden animate-fade-in-up">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-gray-800">目录</h3>
                <button id="close-toc-modal-btn" class="text-gray-400 hover:text-gray-600" aria-label="关闭目录弹窗">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div id="toc-list" class="overflow-y-auto p-4 space-y-2 flex-1"></div>
        </div>
    </div>

    <!-- Search Modal -->
    <div id="search-modal"
        class="fixed inset-0 bg-black/50 backdrop-blur-sm items-center justify-center hidden z-50 p-4">
        <div
            class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[80vh] flex flex-col overflow-hidden animate-fade-in-up">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-gray-800">全文检索</h3>
                <button id="close-search-modal-btn" class="text-gray-400 hover:text-gray-600" aria-label="关闭搜索弹窗">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="p-4">
                <form id="search-form" class="flex space-x-2 mb-4">
                    <input id="search-input" type="text"
                        class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                        placeholder="输入关键字..." required minlength="2">
                    <button type="submit"
                        class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors font-medium">搜索</button>
                </form>
                <div id="search-status" class="text-sm text-gray-500 h-5 mb-2"></div>
                <div id="search-results" class="space-y-3 max-h-[400px] overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <!-- User Modal -->
    <div id="user-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden animate-fade-in-up">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-gray-800">个人资料</h3>
                <button id="close-user-modal-btn" class="text-gray-400 hover:text-gray-600" aria-label="关闭用户信息弹窗">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div id="profile-view" class="p-6">
                <!-- Profile content (same logic, better style) -->
                <div class="mb-6 text-center">
                    <div
                        class="w-20 h-20 bg-blue-100 rounded-full mx-auto flex items-center justify-center text-blue-600 mb-3">
                        <svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                    <h4 id="user-username-display" class="text-xl font-bold text-gray-900">-</h4>
                    <p id="user-email-display" class="text-sm text-gray-500">-</p>
                    <button id="user-username-edit-btn"
                        class="text-xs text-blue-600 hover:text-blue-700 mt-1">修改用户名</button>

                    <div id="user-username-edit" class="mt-3 hidden">
                        <div class="flex space-x-2">
                            <input type="text" id="user-username-input"
                                class="flex-1 border border-gray-300 rounded px-2 py-1 text-sm" placeholder="新用户名">
                            <button id="user-username-save-btn"
                                class="bg-blue-600 text-white px-3 py-1 rounded text-xs">保存</button>
                            <button id="user-username-cancel-btn" class="text-gray-500 text-xs">取消</button>
                        </div>
                        <p id="user-username-status" class="text-xs text-red-500 mt-1"></p>
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">DeepSeek
                            API Key</label>
                        <div class="flex space-x-2">
                            <input type="password" id="api-key-input"
                                class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                                placeholder="输入 API Key">
                            <button id="save-key-btn"
                                class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm hover:bg-gray-900">保存</button>
                        </div>
                        <p id="save-status" class="text-xs mt-1 h-4"></p>
                    </div>

                    <div class="pt-4 border-t border-gray-100 space-y-2">
                        <button id="clear-progress-btn"
                            class="w-full border border-yellow-500 text-yellow-600 py-2 rounded-lg text-sm hover:bg-yellow-50 transition-colors">清除本书进度</button>
                        <button id="logout-btn"
                            class="w-full bg-red-50 text-red-600 py-2 rounded-lg text-sm hover:bg-red-100 transition-colors">退出登录</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Login/Register Modals (Refactored) -->
    <div id="login-modal" class="fixed inset-0 bg-gray-900 items-center justify-center hidden z-50 p-4 flex">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 animate-fade-in-up">
            <div class="text-center mb-8">
                <div
                    class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-2xl mx-auto mb-4">
                    E</div>
                <h2 class="text-2xl font-bold text-gray-900">欢迎回来</h2>
                <p class="text-gray-500 text-sm mt-2">请登录以继续您的阅读之旅</p>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
                    <input type="email" id="login-email"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none transition-shadow"
                        placeholder="name@example.com" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                    <input type="password" id="login-password"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none transition-shadow"
                        placeholder="••••••••" required>
                </div>
                <button type="submit"
                    class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition-transform active:scale-95">登录</button>
            </form>

            <p id="login-error" class="text-red-500 text-sm mt-4 text-center min-h-[20px]"></p>

            <p class="text-center text-sm text-gray-600 mt-6">
                还没有账号？ <button id="show-register-btn" class="text-blue-600 font-semibold hover:underline">立即注册</button>
            </p>
        </div>
    </div>

    <div id="register-modal" class="fixed inset-0 bg-gray-900 items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 animate-fade-in-up">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-gray-900">创建账号</h2>
                <p class="text-gray-500 text-sm mt-2">加入 englearn，开启智能阅读</p>
            </div>

            <form id="register-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
                    <input type="email" id="register-email"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
                        required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                    <input type="text" id="register-username"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
                        required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                    <input type="password" id="register-password"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
                        minlength="6" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">确认密码</label>
                    <input type="password" id="confirm-password"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
                        minlength="6" required>
                </div>
                <button type="submit"
                    class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition-transform active:scale-95">注册</button>
            </form>

            <p id="register-error" class="text-red-500 text-sm mt-4 text-center min-h-[20px]"></p>

            <p class="text-center text-sm text-gray-600 mt-6">
                已有账号？ <button id="show-login-btn" class="text-blue-600 font-semibold hover:underline">立即登录</button>
            </p>
        </div>
    </div>

    <!-- AI Modal -->
    <div id="ai-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm items-center justify-center hidden z-50 p-4">
        <div
            class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[80vh] flex flex-col overflow-hidden animate-fade-in-up">
            <div
                class="p-4 border-b border-gray-100 flex justify-between items-center bg-gradient-to-r from-blue-50 to-white">
                <h3 class="font-bold text-gray-800 flex items-center">
                    <span class="text-xl mr-2">✨</span> AI 助解
                </h3>
                <button id="close-modal-btn" class="text-gray-400 hover:text-gray-600" aria-label="关闭 AI 弹窗">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div id="modal-content" class="p-6 overflow-y-auto text-base leading-relaxed text-gray-700">
                <div id="modal-loader" class="flex justify-center items-center h-32">
                    <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-blue-500"></div>
                </div>
                <p id="ai-response" class="whitespace-pre-wrap font-sans"></p>
            </div>
        </div>
    </div>

    <!-- Print Container (Hidden) -->
    <div id="print-container" class="hidden"></div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
